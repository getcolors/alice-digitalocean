# Desired state for alice-digitalocean. This file contains non-secret values
# only. The DigitalOcean API token belongs in the gitignored .envrc.private as
# COLORS_PAR_DO_TOKEN.
#
# Never export COLORS_PAR_PROFILE. The profile identifies this deployment and
# its state; the launcher must reject attempts to overlay it.

profile: alice-digitalocean
workdir: .colors

provider-compute: digitalocean
provider-dns: false
provider-backend: local

# Preserve this guard in committed desired state. It may only be overridden for
# the separately authorized deletion after deployment verification.
compute-prevent-destroy: true

# Preserve the behavior and defaults of the original Alice deployment.
package: alice
digitalocean-name: alice
digitalocean-region: ams3
digitalocean-size: s-1vcpu-1gb-35gb-intel
digitalocean-image: ubuntu-24-04-x64
# No digitalocean-vpc-uuid. The region's default VPC is discovered at runtime
# through a data source, and the apply asserts that it really is the account
# default. ams3's default VPC is the one this deployment used to pin by hand.
#
# No digitalocean-ssh-keys. The package generates and owns an ed25519 keypair
# named after the profile in ~/.ssh, registers it with DigitalOcean, and removes
# both once the Droplet is destroyed. Supplying either key is the escape hatch,
# and presence is the only switch — there is no mode flag for either.

# The private Transmission RPC tunnel. The managed ~/.ssh/config block now names
# the generated key itself, so no identity file is configured here.
transmission-rpc-port: 9091
transmission-tunnel-local-port: 19091

# Sync downloads directly into this local directory. Existing local files are
# never deleted.
transmission-local-directory: ~/Downloads/alice
transmission-magnet-links: []
